name: OpenEdgeDSL v2 Cross-Repo Parity

on:
  pull_request:
    paths:
      - 'v2/**'
      - '.github/workflows/v2-cross-repo-parity.yml'
  push:
    branches:
      - main
    paths:
      - 'v2/**'
      - '.github/workflows/v2-cross-repo-parity.yml'
  workflow_dispatch:

jobs:
  simulator-parity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout OpenEdgeDSL
        uses: actions/checkout@v4
        with:
          path: OpenEdgeDSL

      - name: Checkout UMA-CGRA-Simulator
        uses: actions/checkout@v4
        with:
          repository: PhDCristian/UMA-CGRA-Simulator
          ref: main
          path: UMA-CGRA-Simulator

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            OpenEdgeDSL/v2/package-lock.json
            UMA-CGRA-Simulator/package-lock.json

      - name: Install OpenEdgeDSL v2 dependencies
        working-directory: OpenEdgeDSL/v2
        run: npm ci

      - name: Run simulator parity tests
        working-directory: OpenEdgeDSL/v2
        run: npm run test:simulator-parity

name: CASTM CI

on:
  pull_request:
    paths:
      - 'packages/**'
      - 'scripts/**'
      - 'tests/**'
      - 'docs/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'vitest.config.ts'
      - '.github/workflows/ci.yml'
  push:
    branches:
      - main
    paths:
      - 'packages/**'
      - 'scripts/**'
      - 'tests/**'
      - 'docs/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'vitest.config.ts'
      - '.github/workflows/ci.yml'

jobs:
  compiler-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate import boundaries
        run: npm run check:boundaries

      - name: Generate docs
        run: npm run docs:generate

      - name: Run tests with coverage gate
        run: npm run test:coverage

name: CASTM Cross-Repo Parity

on:
  workflow_dispatch:

jobs:
  simulator-parity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CASTM
        uses: actions/checkout@v5
        with:
          path: CASTM

      - name: Checkout UMA-CGRA-Simulator
        uses: actions/checkout@v5
        with:
          repository: PhDCristian/UMA-CGRA-Simulator
          token: ${{ secrets.CROSS_REPO_PAT }}
          ref: main
          path: UMA-CGRA-Simulator

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            CASTM/package-lock.json
            UMA-CGRA-Simulator/package-lock.json

      - name: Install CASTM dependencies
        working-directory: CASTM
        run: npm ci

      - name: Run simulator parity tests
        working-directory: CASTM
        run: npm run test:simulator-parity
